apiVersion: v1
kind: ConfigMap
metadata:
  name: temperature-converter-config
data:
  DB_HOST: host.minikube.internal
  DB_PORT: "3306"
  DB_NAME: temperature_converter_db
  DISPLAY: host.minikube.internal:0.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: luaram/temperature-converter:latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: temperature-converter-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: temperature-converter-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: temperature-converter-config
                  key: DB_NAME
            - name: DISPLAY
              valueFrom:
                configMapKeyRef:
                  name: temperature-converter-config
                  key: DISPLAY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: temperature-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temperature-db
                  key: password
